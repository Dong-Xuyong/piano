<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f4ef" />
  <title>Piano</title>
  <link href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="dong-ui/theme.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <script src="dong-ui/theme.js"></script>
</head>
<body>
  <button type="button" data-dong-theme-toggle aria-label="Toggle color theme"></button>
  <main>
    <header class="top">
      <h1>Piano</h1>
      <p id="sync">Not synced</p>
    </header>
    <section id="consistency" aria-label="Consistency"></section>
    <section id="plan" aria-label="Next session"></section>
    <section id="heatmap" aria-label="Practice heatmap"></section>
    <section id="pieces" aria-label="Pieces"></section>
    <section id="ear" aria-label="Ear training"></section>
    <section id="sight" aria-label="Sight reading"></section>
    <section id="recordings" aria-label="Recordings"></section>
    <section id="insights" aria-label="Insights"></section>
  </main>
  <script src="dong-ui/gh-sync.js"></script>
  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
