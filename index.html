<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f4ef" />
  <title>Piano Practice</title>
  <link href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="dong-ui/theme.css" />
  <link rel="stylesheet" href="styles.css?v=2" />
  <link rel="manifest" href="manifest.webmanifest" />
  <script src="dong-ui/theme.js"></script>
</head>
<body>
  <a class="dong-home-link" href="https://dong-xuyong.github.io/" aria-label="Back to all apps" title="All apps"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg></a>
  <button type="button" data-dong-theme-toggle aria-label="Toggle color theme"></button>
  <main>
    <header class="top">
      <h1>Piano Practice</h1>
      <p id="sync">Not synced</p>
      <a class="log-link" href="#/log">Log practice</a>
    </header>
    <p id="demo-banner" class="demo-banner" hidden>Demo data</p>
    <p id="format-banner" class="format-banner" hidden>Newer data format, update the app</p>
    <section id="consistency" aria-label="Consistency"></section>
    <section id="plan" aria-label="Next session"></section>
    <section id="heatmap" aria-label="Practice heatmap"></section>
    <section id="pieces" aria-label="Pieces"></section>
    <section id="ear" aria-label="Ear training"></section>
    <section id="sight" aria-label="Sight reading"></section>
    <section id="recordings" aria-label="Recordings"></section>
    <section id="insights" aria-label="Insights"></section>
    <section id="log" hidden>
      <p class="log-back"><a href="#/">Dashboard</a></p>
      <h2>Log practice</h2>
      <form id="log-form" class="card" autocomplete="off">
        <label for="log-date">Date
          <input id="log-date" name="date" type="date" required />
        </label>
        <label for="log-minutes">Minutes
          <input id="log-minutes" name="minutes" type="text" inputmode="numeric" required />
        </label>
        <div class="chips" role="group" aria-label="Quick minutes">
          <button type="button" data-minutes="10">10</button>
          <button type="button" data-minutes="20">20</button>
          <button type="button" data-minutes="30">30</button>
          <button type="button" data-minutes="45">45</button>
        </div>
        <label for="log-piece">Piece
          <select id="log-piece" name="piece"></select>
        </label>
        <label id="log-piece-title-label" for="log-piece-title" hidden>Piece name
          <input id="log-piece-title" name="pieceTitle" type="text" maxlength="120" />
        </label>
        <label for="log-note">Note
          <input id="log-note" name="note" type="text" maxlength="500" />
        </label>
        <p id="log-error" class="log-error" hidden></p>
        <div class="log-actions">
          <button type="submit" id="log-save">Save</button>
          <button type="button" id="log-cancel" hidden>Cancel</button>
        </div>
      </form>
      <div id="log-summary"></div>
      <div id="log-list"></div>
    </section>
  </main>
  <script src="dong-ui/gh-sync.js"></script>
  <script src="core.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
